spring:
  application:
    name: ai-incident-analyzer

server:
  port: 8091

management:
  endpoints:
    web:
      exposure:
        include: health,info

incident-context:
  base-url: http://incident-context:8090

prometheus:
  base-url: http://prometheus:9090

anomaly:
  historical-window-minutes: 30
  step-seconds: 60
