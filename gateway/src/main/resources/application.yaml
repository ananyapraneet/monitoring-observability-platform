spring:
  application:
    name: api-gateway

server:
  port: 8082

services:
  user-service:
    url: ${USER_SERVICE_URL:http://localhost:8080}

  order-service:
    url: ${ORDER_SERVICE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
