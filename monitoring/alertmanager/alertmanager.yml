global:
  resolve_timeout: 5m

route:
  receiver: "incident-context"

  group_by:
    - alertname
    - service
    - severity
    - environment

  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: "incident-context"
    webhook_configs:
      - url: "http://incident-context:8090/api/v1/alerts"
